<div class="pdnc-premium-window">
    <div class="pdnc-nav-grid" style="display: flex; gap: 10px; margin-bottom: 10px;">
        <div class="form-group" style="flex: 1;">
            <label>{{localize "PDNC.TimeDay"}}</label>
            <input type="number" id="pdnc-nav-day" value="{{currentDay}}" min="1" max="31">
        </div>
        <div class="form-group" style="flex: 2;">
            <label>{{localize "PDNC.Month"}}</label>
            <select id="pdnc-nav-month">
                {{#each months}}
                <option value="{{this.value}}" {{#if this.selected}}selected{{/if}}>{{this.label}}</option>
                {{/each}}
            </select>
        </div>
        <div class="form-group" style="flex: 1;">
            <label>{{localize "PDNC.Year"}}</label>
            <input type="number" id="pdnc-nav-year" value="{{currentYear}}">
        </div>
    </div>
    <p class="notes" style="text-align: center; margin-bottom: 15px;">
        {{localize "PDNC.TimeMachineHelp"}}
    </p>
    <footer class="sheet-footer" style="display: flex; justify-content: center;">
        <button type="button" data-action="save" class="pdnc-btn-save" style="width: auto;">
            <i class='fas fa-hourglass-start'></i> {{localize "PDNC.SetWorldTime"}}
        </button>
    </footer>
</div>

<div
  class="pdnc-weather-chat"
  style="
    background-image: url('modules/phils-day-night-cycle/assets/weather_bg.webp');
    background-size: cover;
    background-position: center;
    color: #fff;
    padding: 10px;
    border: 1px solid #444;
    border-radius: 5px;
    text-shadow: 1px 1px 2px black;
    font-family: 'Signika', sans-serif;
  "
>
  <h3
    style="
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
      margin-top: 0;
      padding-bottom: 5px;
    "
  >
    {{date}}
  </h3>
  <div style="font-size: 0.9em; opacity: 0.9; margin-bottom: 8px">
    <strong>Region:</strong> {{climate}}<br />
    <strong>Season:</strong> {{season}}
  </div>
  <div
    style="
      font-size: 1.1em;
      margin-bottom: 10px;
      font-weight: bold;
      line-height: 1.4;
    "
  >
    {{text}}
  </div>
  <div
    style="
      background: rgba(0, 0, 0, 0.4);
      padding: 5px;
      border-radius: 3px;
      text-align: center;
    "
  >
    <i class="fas fa-thermometer-half"></i> {{temp}}
  </div>
</div>
